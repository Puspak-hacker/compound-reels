<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Reels</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; height: 100vh; }
        
        #loader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #000; color: #00ffff; font-family: monospace; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #00ffff; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .reel-container { scroll-snap-type: y mandatory; height: 100vh; overflow-y: scroll; scrollbar-width: none; }
        .reel-container::-webkit-scrollbar { display: none; }
        
        .reel-card { scroll-snap-align: start; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; background-color: #0c0c0c; position: relative; }
        
        .header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-family: monospace; color: #00ffff; padding-top: 10px; }
        
        .image-box { width: 100%; max-width: 350px; height: 42vh; background: #fff; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: auto; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .image-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .footer { padding-bottom: 30px; }
        .formula { font-size: 34px; font-weight: 900; margin-bottom: 8px; letter-spacing: 1px; color: #ffffff; }
        .formula sub { font-size: 0.6em; vertical-align: sub; }
        .name { font-size: 14px; color: #bbb; margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
        
        .meta-row { display: flex; items-center: center; gap: 10px; flex-wrap: wrap; }
        .weight { display: inline-block; background: #1a1a1a; border: 1px solid #333; padding: 8px 14px; border-radius: 20px; font-size: 12px; color: #ffdd00; font-family: monospace; }
        
        .pubchem-btn { 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            background: #00ffff; 
            color: #000; 
            text-decoration: none; 
            font-weight: bold; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-family: monospace;
            transition: transform 0.2s;
        }
        .pubchem-btn:active { transform: scale(0.95); }

        .loading-more { text-align: center; padding: 20px; font-family: monospace; color: #00ffff; font-size: 12px; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p>FETCHING PUBCHEM REELS...</p>
    </div>

    <div id="feed" class="reel-container" style="display: none;"></div>

    <script>
        const feed = document.getElementById('feed');
        let isLoading = false;

        // Function to convert raw chemical formula string to properly formatted HTML with <sub> tags
        function formatFormula(formula) {
            if (!formula || formula === 'N/A') return 'N/A';
            return formula.replace(/(\d+)/g, '<sub>$1</sub>');
        }

        // Generate 5 random PubChem CIDs (ranging from popular low CIDs to ~10,000)
        function getRandomCids(count = 5) {
            const cids = [];
            for (let i = 0; i < count; i++) {
                cids.push(Math.floor(Math.random() * 9500) + 1);
            }
            return cids;
        }

        async function fetchMoreCompounds() {
            if (isLoading) return;
            isLoading = true;

            const cids = getRandomCids(5);

            try {
                const res = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cids.join(',')}/property/IUPACName,MolecularFormula,MolecularWeight/JSON`);
                
                if (!res.ok) throw new Error('API response failed');

                const data = await res.json();
                const properties = data.PropertyTable?.Properties || [];

                properties.forEach(prop => {
                    const cid = prop.CID;
                    const name = prop.IUPACName || 'Chemical Compound';
                    const rawFormula = prop.MolecularFormula || 'N/A';
                    const formattedFormula = formatFormula(rawFormula);
                    const weight = prop.MolecularWeight || 'N/A';
                    const imageUrl = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/PNG?image_size=large`;
                    const webPageUrl = `https://pubchem.ncbi.nlm.nih.gov/compound/${cid}`;

                    const card = document.createElement('div');
                    card.className = 'reel-card';
                    card.innerHTML = `
                        <div class="header">
                            <span>PUBCHEM REELS</span>
                            <span>CID: ${cid}</span>
                        </div>
                        <div class="image-box">
                            <img src="${imageUrl}" alt="Chemical Structure" loading="lazy">
                        </div>
                        <div class="footer">
                            <div class="formula">${formattedFormula}</div>
                            <div class="name" title="${name}">${name}</div>
                            <div class="meta-row">
                                <div class="weight">Mol. Wt: ${weight} g/mol</div>
                                <a href="${webPageUrl}" target="_blank" rel="noopener noreferrer" class="pubchem-btn">
                                    <span>VIEW PUBCHEM</span> ↗
                                </a>
                            </div>
                        </div>
                    `;
                    feed.appendChild(card);
                });

                document.getElementById('loader').style.display = 'none';
                feed.style.display = 'block';

            } catch (err) {
                console.warn('Skipped a failed batch, retrying...', err);
            } finally {
                isLoading = false;
            }
        }

        // Infinite Scroll Event Listener
        feed.addEventListener('scroll', () => {
            // Trigger fetch when user is within 2 reel heights from the bottom
            if (feed.scrollTop + feed.clientHeight >= feed.scrollHeight - (window.innerHeight * 2)) {
                fetchMoreCompounds();
            }
        });

        // Initial fetch on page load
        fetchMoreCompounds();
    </script>
</body>
</html>
