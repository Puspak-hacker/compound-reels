<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Reels</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; height: 100vh; }
        
        /* Top Navigation & Search Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0));
        }
        .search-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(5px);
        }
        .search-input::placeholder { color: #aaa; }
        .search-input:focus { border-color: #00ffff; background: rgba(0, 0, 0, 0.8); }
        .search-btn {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            font-family: monospace;
        }

        #loader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #000; color: #00ffff; font-family: monospace; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #00ffff; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .reel-container { scroll-snap-type: y mandatory; height: 100vh; overflow-y: scroll; scrollbar-width: none; }
        .reel-container::-webkit-scrollbar { display: none; }
        
        .reel-card { scroll-snap-align: start; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 70px 24px 24px 24px; background-color: #0c0c0c; position: relative; }
        
        .header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-family: monospace; color: #00ffff; }
        
        .image-box { width: 100%; max-width: 350px; height: 40vh; background: #fff; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: auto; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .image-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .footer { padding-bottom: 20px; }
        .tag { display: inline-block; background: #00ffff1a; color: #00ffff; border: 1px solid #00ffff4d; font-size: 11px; font-family: monospace; padding: 3px 10px; border-radius: 12px; margin-bottom: 8px; text-transform: uppercase; }
        .formula { font-size: 32px; font-weight: 900; margin-bottom: 6px; letter-spacing: 1px; color: #ffffff; }
        .formula sub { font-size: 0.6em; vertical-align: sub; }
        .name { font-size: 14px; color: #bbb; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
        
        .meta-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .weight { display: inline-block; background: #1a1a1a; border: 1px solid #333; padding: 8px 14px; border-radius: 20px; font-size: 12px; color: #ffdd00; font-family: monospace; }
        
        .pubchem-btn { 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            background: #00ffff; 
            color: #000; 
            text-decoration: none; 
            font-weight: bold; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-family: monospace;
        }
    </style>
</head>
<body>

    <!-- Top Search Header -->
    <div class="top-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search compound (e.g. Aspirin, Caffeine, C8H10N4O2)...">
        <button onclick="handleSearch()" class="search-btn">SEARCH</button>
    </div>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <p id="loaderText">FETCHING PUBCHEM REELS...</p>
    </div>

    <!-- Reels Container -->
    <div id="feed" class="reel-container" style="display: none;"></div>

    <script>
        const feed = document.getElementById('feed');
        const searchInput = document.getElementById('searchInput');
        let isLoading = false;
        let isSearchMode = false;

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        function formatFormula(formula) {
            if (!formula || formula === 'N/A') return 'N/A';
            return formula.replace(/(\d+)/g, '<sub>$1</sub>');
        }

        function getRandomCids(count = 5) {
            const cids = [];
            for (let i = 0; i < count; i++) {
                cids.push(Math.floor(Math.random() * 9500) + 1);
            }
            return cids;
        }

        // Fetch use-case category tag (e.g., Drug, Natural Product, Industrial)
        async function fetchCategoryTag(cid) {
            try {
                const res = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/classification/JSON`);
                const data = await res.json();
                const strData = JSON.stringify(data).toLowerCase();
                
                if (strData.includes('pharmaceutical') || strData.includes('drug') || strData.includes('medicinal')) return 'Pharmaceutical / Drug';
                if (strData.includes('natural product') || strData.includes('plant') || strData.includes('metabolite')) return 'Natural Product';
                if (strData.includes('pesticide') || strData.includes('herbicide')) return 'Agrochemical / Pesticide';
                if (strData.includes('food') || strData.includes('flavor')) return 'Food Additive / Flavor';
                return 'Chemical Compound';
            } catch {
                return 'Chemical Compound';
            }
        }

        async function createReelCard(prop) {
            const cid = prop.CID;
            const name = prop.IUPACName || 'Chemical Compound';
            const rawFormula = prop.MolecularFormula || 'N/A';
            const formattedFormula = formatFormula(rawFormula);
            const weight = prop.MolecularWeight || 'N/A';
            const imageUrl = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/PNG?image_size=large`;
            const webPageUrl = `https://pubchem.ncbi.nlm.nih.gov/compound/${cid}`;
            
            const categoryTag = await fetchCategoryTag(cid);

            const card = document.createElement('div');
            card.className = 'reel-card';
            card.innerHTML = `
                <div class="header">
                    <span>PUBCHEM REELS</span>
                    <span>CID: ${cid}</span>
                </div>
                <div class="image-box">
                    <img src="${imageUrl}" alt="Chemical Structure" loading="lazy">
                </div>
                <div class="footer">
                    <div class="tag">${categoryTag}</div>
                    <div class="formula">${formattedFormula}</div>
                    <div class="name" title="${name}">${name}</div>
                    <div class="meta-row">
                        <div class="weight">Mol. Wt: ${weight} g/mol</div>
                        <a href="${webPageUrl}" target="_blank" rel="noopener noreferrer" class="pubchem-btn">
                            <span>VIEW PUBCHEM</span> ↗
                        </a>
                    </div>
                </div>
            `;
            return card;
        }

        async function fetchMoreRandomCompounds() {
            if (isLoading || isSearchMode) return;
            isLoading = true;

            const cids = getRandomCids(5);

            try {
                const res = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cids.join(',')}/property/IUPACName,MolecularFormula,MolecularWeight/JSON`);
                if (!res.ok) throw new Error('Failed to fetch batch');

                const data = await res.json();
                const properties = data.PropertyTable?.Properties || [];

                for (const prop of properties) {
                    const card = await createReelCard(prop);
                    feed.appendChild(card);
                }

                document.getElementById('loader').style.display = 'none';
                feed.style.display = 'block';
            } catch (err) {
                console.warn('Retrying batch fetch...', err);
            } finally {
                isLoading = false;
            }
        }

        async function handleSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            isSearchMode = true;
            document.getElementById('loader').style.display = 'flex';
            document.getElementById('loaderText').innerText = `SEARCHING PUBCHEM FOR "${query.toUpperCase()}"...`;
            feed.style.display = 'none';
            feed.innerHTML = '';

            try {
                // First attempt: resolve name/formula to CID
                const cidRes = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${encodeURIComponent(query)}/cids/JSON`);
                let cidList = [];

                if (cidRes.ok) {
                    const cidData = await cidRes.json();
                    cidList = cidData.IdentifierList?.CID || [];
                } else if (!isNaN(query)) {
                    cidList = [parseInt(query)];
                }

                if (cidList.length === 0) throw new Error('Compound not found');

                const targetCids = cidList.slice(0, 5); // Take top 5 search matches
                const propRes = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${targetCids.join(',')}/property/IUPACName,MolecularFormula,MolecularWeight/JSON`);
                const propData = await propRes.json();
                const properties = propData.PropertyTable?.Properties || [];

                for (const prop of properties) {
                    const card = await createReelCard(prop);
                    feed.appendChild(card);
                }

                document.getElementById('loader').style.display = 'none';
                feed.style.display = 'block';
            } catch (err) {
                alert(`Could not find compound "${query}". Check spelling or try a CID number.`);
                isSearchMode = false;
                document.getElementById('loader').style.display = 'none';
                feed.style.display = 'block';
            }
        }

        // Infinite Scroll Listener
        feed.addEventListener('scroll', () => {
            if (!isSearchMode && feed.scrollTop + feed.clientHeight >= feed.scrollHeight - (window.innerHeight * 2)) {
                fetchMoreRandomCompounds();
            }
        });

        // Initial Load
        fetchMoreRandomCompounds();
    </script>
</body>
</html>
