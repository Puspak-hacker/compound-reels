<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Compound Reels</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; height: 100vh; }
        
        #loader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #000; color: #00ffff; font-family: monospace; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #00ffff; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .reel-container { scroll-snap-type: y mandatory; height: 100vh; overflow-y: scroll; scrollbar-width: none; }
        .reel-container::-webkit-scrollbar { display: none; }
        
        .reel-card { scroll-snap-align: start; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; background-color: #0c0c0c; position: relative; }
        
        .header { display: flex; justify-content: space-between; font-size: 12px; font-family: monospace; color: #00ffff; padding-top: 10px; }
        
        .image-box { width: 100%; max-width: 350px; height: 45vh; background: #fff; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: auto; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .image-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .footer { padding-bottom: 40px; }
        .formula { font-size: 36px; font-weight: 900; margin-bottom: 8px; letter-spacing: 1px; }
        .name { font-size: 14px; color: #bbb; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
        .weight { display: inline-block; background: #1a1a1a; border: 1px solid #333; padding: 6px 14px; border-radius: 20px; font-size: 12px; color: #ffdd00; font-family: monospace; }
        
        .loading-more { scroll-snap-align: start; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #00ffff; font-family: monospace; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p>LOADING PUBCHEM REELS...</p>
    </div>

    <div id="feed" class="reel-container" style="display: none;"></div>

    <script>
        const feed = document.getElementById('feed');
        let isLoading = false;

        // Function to generate a batch of random valid compound CIDs
        function getRandomCIDs(count = 5) {
            const cids = [];
            for (let i = 0; i < count; i++) {
                // Pick random CIDs between 1 and 50,000 (well-documented compounds)
                const randomCid = Math.floor(Math.random() * 50000) + 1;
                cids.push(randomCid);
            }
            return cids;
        }

        async function fetchMoreCompounds() {
            if (isLoading) return;
            isLoading = true;

            const cids = getRandomCIDs(6);

            try {
                const res = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cids.join(',')}/property/IUPACName,MolecularFormula,MolecularWeight/JSON`);
                const data = await res.json();
                const properties = data.PropertyTable?.Properties || [];

                properties.forEach(prop => {
                    const cid = prop.CID;
                    const name = prop.IUPACName || 'IUPAC Name Unavailable';
                    const formula = prop.MolecularFormula || 'N/A';
                    const weight = prop.MolecularWeight || 'N/A';
                    const imageUrl = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/PNG?image_size=large`;

                    const card = document.createElement('div');
                    card.className = 'reel-card';
                    card.innerHTML = `
                        <div class="header">
                            <span>PUBCHEM REELS (INFINITE)</span>
                            <span>CID: ${cid}</span>
                        </div>
                        <div class="image-box">
                            <img src="${imageUrl}" alt="Chemical Structure" loading="lazy">
                        </div>
                        <div class="footer">
                            <div class="formula">${formula}</div>
                            <div class="name">${name}</div>
                            <div class="weight">Mol. Weight: ${weight} g/mol</div>
                        </div>
                    `;
                    feed.appendChild(card);
                });

                document.getElementById('loader').style.display = 'none';
                feed.style.display = 'block';
            } catch (err) {
                console.error("Error fetching batch, retrying...", err);
            } finally {
                isLoading = false;
            }
        }

        // Infinite Scroll Listener
        feed.addEventListener('scroll', () => {
            // When user reaches near bottom (within 2 screen heights), fetch next batch
            if (feed.scrollTop + feed.clientHeight >= feed.scrollHeight - (window.innerHeight * 2)) {
                fetchMoreCompounds();
            }
        });

        // Initial Load (loads 2 batches = ~12 compounds to start)
        async function init() {
            await fetchMoreCompounds();
            await fetchMoreCompounds();
        }

        init();
    </script>
</body>
</html>
