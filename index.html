<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Reels</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Hide scrollbars for clean reels look */
        ::-webkit-scrollbar { display: none; }
        .reel-container {
            scroll-snap-type: y mandatory;
            height: 100vh;
            overflow-y: scroll;
        }
        .reel-card {
            scroll-snap-align: start;
            height: 100vh;
        }
    </style>
</head>
<body class="bg-black text-white m-0 p-0 overflow-hidden">

    <!-- Loading Screen -->
    <div id="loader" class="flex flex-col items-center justify-center h-screen bg-black">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-cyan-400 mb-4"></div>
        <p class="text-cyan-400 font-mono text-sm tracking-widest">FETCHING PUBCHEM DATA...</p>
    </div>

    <!-- Reels Vertical Feed -->
    <div id="feed" class="reel-container hidden"></div>

    <script>
        // Popular compound CIDs: Water, Caffeine, Aspirin, Glucose, Ethanol, Vanillin, etc.
        const cids = [224, 2519, 2244, 5793, 702, 1183, 962, 1983, 6322];

        async function loadCompounds() {
            try {
                const response = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cids.join(',')}/property/IUPACName,MolecularFormula,MolecularWeight/JSON`);
                const data = await response.json();
                const properties = data.PropertyTable.Properties;

                const feed = document.getElementById('feed');
                feed.innerHTML = '';

                properties.forEach(prop => {
                    const cid = prop.CID;
                    const name = prop.IUPACName || 'Unknown Compound';
                    const formula = prop.MolecularFormula || 'N/A';
                    const weight = prop.MolecularWeight || 'N/A';
                    const imageUrl = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/PNG?image_size=large`;

                    const card = document.createElement('div');
                    card.className = 'reel-card relative flex flex-col items-center justify-between p-6 bg-zinc-950';
                    
                    card.innerHTML = `
                        <!-- Top Header -->
                        <div class="w-full flex justify-between items-center text-xs font-mono text-cyan-400 pt-4">
                            <span>PUBCHEM REELS</span>
                            <span>CID: ${cid}</span>
                        </div>

                        <!-- Center Image Card -->
                        <div class="w-full max-w-sm bg-white rounded-3xl p-6 shadow-2xl flex items-center justify-center my-auto" style="height: 45vh;">
                            <img src="${imageUrl}" alt="Chemical Structure" class="max-h-full max-w-full object-contain">
                        </div>

                        <!-- Bottom Metadata Overlay -->
                        <div class="w-full pb-12 px-2">
                            <h1 class="text-4xl font-black tracking-wider text-white mb-2">${formula}</h1>
                            <p class="text-sm text-zinc-300 line-clamp-2 mb-3 leading-relaxed">${name}</p>
                            <div class="inline-block bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-full text-xs text-yellow-400 font-mono">
                                Mol. Weight: ${weight} g/mol
                            </div>
                        </div>
                    `;
                    feed.appendChild(card);
                });

                document.getElementById('loader').style.display = 'none';
                feed.classList.remove('hidden');
            } catch (error) {
                document.getElementById('loader').innerHTML = '<p class="text-red-500 font-mono">Failed to load PubChem data. Check internet connection.</p>';
            }
        }

        loadCompounds();
    </script>
</body>
</html>
